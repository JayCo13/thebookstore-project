# Nginx API-Only Configuration
# Frontend is now on Netlify — VPS only serves Backend API + static uploads
#
# IMPORTANT: Replace tamnguon.com with your actual domain
# This config is a REFERENCE for you to update on VPS.
# Do NOT overwrite your VPS nginx.conf directly — compare and merge manually.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream — only Backend now (no more frontend_server)
    upstream backend_server {
        server bookstore-backend:8000;
    }

    # HTTP Server - Redirect to HTTPS (except for ACME challenge)
    server {
        listen 80;
        server_name tamnguon.com www.tamnguon.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server — API Gateway Only
    server {
        listen 443 ssl http2;
        server_name tamnguon.com www.tamnguon.com;

        # SSL certificates from Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/tamnguon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tamnguon.com/privkey.pem;

        # SSL settings (modern configuration)
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # CORS — Allow Netlify frontend to call this API
        # Replace YOUR_NETLIFY_SITE.netlify.app with your actual Netlify URL
        set $cors_origin "";
        if ($http_origin ~* "^https://(tamnguon\.com|www\.tamnguon\.com|YOUR_NETLIFY_SITE\.netlify\.app)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # API requests -> Backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_server/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            client_max_body_size 50M;
        }

        # Proxy sitemap.xml to backend
        location = /sitemap.xml {
            proxy_pass http://backend_server/api/v1/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend static files (images, uploads, etc.)
        location /static/ {
            proxy_pass http://backend_server/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Root — No more frontend, return 404 or redirect to Netlify
        location / {
            return 301 https://YOUR_NETLIFY_SITE.netlify.app$request_uri;
        }
    }
}
