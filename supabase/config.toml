# Supabase local config for the bookstore migration (FastAPI -> Supabase).
# Generated as part of the backend migration. `project_id` is the local stack
# name; link a real project with `supabase link --project-ref <ref>`.

project_id = "bookstore"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 5 MB matches the old `max_file_size` for product images; the audio bucket
# overrides this with a per-bucket limit in the storage migration.
file_size_limit = "50MiB"

[auth]
enabled = true
# Update to the production frontend (Netlify) origin before going live.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "https://tamnguon.com",
  "https://www.tamnguon.com",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Google OAuth — mirrors the old google_oauth service. Secrets come from env.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

# PayOS calls this server-to-server with no Supabase session, so the platform's
# JWT gate would reject every webhook with 401 before the function even runs.
# The function authenticates the caller itself, by verifying PayOS's HMAC-SHA256
# signature over the `data` block and answering 400 on a mismatch.
#
# Declared here rather than relying on `--no-verify-jwt` at deploy time, which
# only applies to that one deploy and silently reverts on the next one.
[functions.payos-webhook]
verify_jwt = false
