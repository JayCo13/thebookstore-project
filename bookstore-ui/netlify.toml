# Netlify Build Configuration for Bookstore Frontend
# React SPA with react-router-dom

[build]
  # CI=false prevents Create React App from treating warnings as errors
  command = "CI=false npm run build"
  # Output directory (create-react-app default)
  publish = "build"

# SPA fallback: redirect all routes to index.html for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
